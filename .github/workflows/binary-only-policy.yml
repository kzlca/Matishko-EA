name: Public distribution policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reject-development-and-binary-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Keep source and media out of the public distribution tree
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -Ei '\.(mq4|mq5|mqh|mqproj|ex4|ex5|mp4)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::MQL source, compiled terminal files, and demo videos must not be committed to this repository."
            printf '%s\n' "$forbidden"
            exit 1
          fi
          echo "Binary-only distribution tree verified."
